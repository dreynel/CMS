<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAT U Barista Kitchen Display (KDS) • Live Screen</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        isatu: {
                            blue: '#002080',
                            dark: '#001557',
                            light: '#1A3FB8',
                            gold: '#F59E0B',
                            'gold-dark': '#D97706',
                            'gold-light': '#FEF3C7',
                        }
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Top KDS Header -->
    <header class="bg-slate-950 text-white px-4 py-3 flex items-center justify-between border-b border-slate-800 shadow-md flex-shrink-0">
        <div class="flex items-center gap-3">
            <img src="assets/images/isatu.png" alt="ISAT U Seal" class="h-10 w-auto">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-base font-black font-heading tracking-tight text-amber-400">Kitchen Display System (KDS)</h1>
                    <span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Station
                    </span>
                </div>
                <p class="text-[11px] text-slate-400">Barista Espresso Bar & Preparation Station</p>
            </div>
        </div>

        <!-- Filter tabs -->
        <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
            <button type="button" class="kds-filter-btn px-3 py-1.5 rounded-lg bg-blue-900 text-amber-400 transition-all" data-filter="all">All Orders</button>
            <button type="button" class="kds-filter-btn px-3 py-1.5 rounded-lg bg-transparent text-slate-400 hover:text-white transition-all" data-filter="dinein">Dine-In</button>
            <button type="button" class="kds-filter-btn px-3 py-1.5 rounded-lg bg-transparent text-slate-400 hover:text-white transition-all" data-filter="takeout">Takeout</button>
            <button type="button" class="kds-filter-btn px-3 py-1.5 rounded-lg bg-transparent text-slate-400 hover:text-white transition-all" data-filter="reservation">Reservation</button>
        </div>

        <!-- Portals Navigation -->
        <div class="flex items-center gap-2 text-xs font-bold">
            <a href="pos.html" class="px-3 py-1.5 rounded-lg bg-blue-900/60 hover:bg-blue-900 text-amber-300 flex items-center gap-1.5 border border-blue-800 transition-all">
                <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">POS</span>
            </a>
            <a href="scanner.html" class="px-3 py-1.5 rounded-lg bg-amber-400 hover:bg-amber-500 text-blue-950 flex items-center gap-1.5 shadow transition-all">
                <i data-lucide="qr-code" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Scanner</span>
            </a>
            <a href="admin.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center gap-1.5 transition-all">
                <i data-lucide="bar-chart-3" class="w-3.5 h-3.5 text-purple-400"></i> <span class="hidden sm:inline">Admin</span>
            </a>
        </div>
    </header>

    <!-- KDS Columns Board (Scrollable Horizontally on Small, 3 or 4 Columns on Large) -->
    <main class="flex-1 p-4 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 overflow-hidden">
        
        <!-- Column 1: Received / Pending -->
        <div class="bg-slate-950/80 rounded-2xl border border-slate-800 flex flex-col overflow-hidden">
            <div class="p-3 bg-amber-500/10 border-b border-amber-500/20 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                    <h3 class="font-bold text-xs uppercase tracking-wider text-amber-300">1. New Orders</h3>
                </div>
                <span id="count-pending" class="px-2 py-0.5 rounded-full bg-amber-400 text-blue-950 font-black text-xs">0</span>
            </div>
            
            <div id="kds-pending-col" class="flex-1 overflow-y-auto p-3 space-y-3">
                <!-- Dynamically populated via kitchen.js -->
            </div>
        </div>

        <!-- Column 2: Brewing / In Progress -->
        <div class="bg-slate-950/80 rounded-2xl border border-slate-800 flex flex-col overflow-hidden">
            <div class="p-3 bg-blue-500/10 border-b border-blue-500/20 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-400"></span>
                    <h3 class="font-bold text-xs uppercase tracking-wider text-blue-300">2. Brewing / Preparing</h3>
                </div>
                <span id="count-brewing" class="px-2 py-0.5 rounded-full bg-blue-500 text-white font-black text-xs">0</span>
            </div>
            
            <div id="kds-brewing-col" class="flex-1 overflow-y-auto p-3 space-y-3">
                <!-- Dynamically populated via kitchen.js -->
            </div>
        </div>

        <!-- Column 3: Ready for Pickup / Delivery -->
        <div class="bg-slate-950/80 rounded-2xl border border-slate-800 flex flex-col overflow-hidden">
            <div class="p-3 bg-emerald-500/10 border-b border-emerald-500/20 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
                    <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-300">3. Ready for Pickup</h3>
                </div>
                <span id="count-ready" class="px-2 py-0.5 rounded-full bg-emerald-500 text-white font-black text-xs">0</span>
            </div>
            
            <div id="kds-ready-col" class="flex-1 overflow-y-auto p-3 space-y-3">
                <!-- Dynamically populated via kitchen.js -->
            </div>
        </div>

        <!-- Column 4: Completed History (Hidden on mobile/tablet, shown on large) -->
        <div class="hidden lg:flex bg-slate-950/80 rounded-2xl border border-slate-800 flex-col overflow-hidden">
            <div class="p-3 bg-slate-800/40 border-b border-slate-800 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-slate-500"></span>
                    <h3 class="font-bold text-xs uppercase tracking-wider text-slate-400">4. Served / Completed</h3>
                </div>
                <span id="count-completed" class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-black text-xs">0</span>
            </div>
            
            <div id="kds-completed-col" class="flex-1 overflow-y-auto p-3 space-y-3 opacity-60">
                <!-- Dynamically populated via kitchen.js -->
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/kitchen.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
