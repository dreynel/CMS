<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6F6"/>
      <stop offset="100%" stop-color="#EEE1BA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#894E3F" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <g transform="translate(200, 125)" filter="url(#shadow)">
    <!-- Plate / Base -->
    <ellipse cx="0" cy="45" rx="55" ry="12" fill="#D5C5B5" opacity="0.6"/>
    <!-- Coffee Cup & Pastry Icon -->
    <circle cx="0" cy="0" r="42" fill="#894E3F"/>
    <!-- Steam / Aroma -->
    <path d="M-10 -55 C-12 -65, -5 -70, -8 -80 M0 -58 C-2 -68, 5 -73, 2 -83 M10 -55 C8 -65, 15 -70, 12 -80" 
          stroke="#C37960" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Cup Outline -->
    <path d="M-22 -15 L22 -15 L18 20 C18 28, -18 28, -18 20 Z" fill="#FFF6F6"/>
    <!-- Cup Handle -->
    <path d="M19 -5 C28 -5, 28 12, 17 12" stroke="#FFF6F6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Coffee Surface -->
    <ellipse cx="0" cy="-12" rx="17" ry="5" fill="#894E3F"/>
  </g>
  <text x="200" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#894E3F" text-anchor="middle" letter-spacing="0.5">RAEDEN'S BAKERY &amp; CAFÉ</text>
  <text x="200" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#a66252" text-anchor="middle">Finished Product</text>
</svg>
